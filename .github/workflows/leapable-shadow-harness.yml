name: leapable-shadow-harness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Leapable shadow harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - name: Run Leapable shadow harness fixtures
        run: cargo test -p calyx-cli --bin calyx leapable::shadow_harness_tests -- --nocapture
