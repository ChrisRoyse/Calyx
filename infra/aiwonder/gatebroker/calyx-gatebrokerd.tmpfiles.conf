# All mutable deletion authority lives below a root-owned /var/lib anchor.
# The worker can traverse the public side, but only root can enter private
# journal/quarantine state. The source checkout is intentionally not created
# or modified by tmpfiles.
d /var/lib/calyx-gatebrokerd                            0711 root root -
d /var/lib/calyx-gatebrokerd/objects                    0711 root root -
d /var/lib/calyx-gatebrokerd/objects/tmp                0711 root root -
d /var/lib/calyx-gatebrokerd/objects/target             0711 root root -
d /var/lib/calyx-gatebrokerd/private                    0700 root root -
d /var/lib/calyx-gatebrokerd/private/journal            0700 root root -
d /var/lib/calyx-gatebrokerd/private/quarantine         0700 root root -
d /var/lib/calyx-gatebrokerd/private/quarantine/tmp     0700 root root -
d /var/lib/calyx-gatebrokerd/private/quarantine/target  0700 root root -
d /run/calyx-gatebrokerd                                0755 root root -
